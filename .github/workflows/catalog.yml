name: Validate and publish catalog
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history, so validation can compare each add-on with the commit the Store was published from.
          fetch-depth: 0
      - name: Validate add-on folders, versions and changelogs
        run: python3 scripts/validate.py
      - name: Build new versions and republish the rest
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: catalog
          path: dist
      - name: Publish reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "catalog-$SOURCE_COMMIT" dist/* --target "$SOURCE_COMMIT" --title "Add-on catalog $SOURCE_COMMIT" --notes "Built from reviewed main commit $SOURCE_COMMIT. Development artifacts are ad-hoc signed." --latest
